[package]
name = "quotaraid"
version = "0.1.0"
edition = "2021"
description = "Your Claude Code usage quota, rendered as a boss fight"
license = "MIT"
repository = "https://github.com/liemle3893/quotaraid"
readme = "README.md"
keywords = ["claude", "usage", "tailscale", "esp32", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.23"
# rustls, not native-tls: the release builds are static musl and must not link OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
