name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The end-to-end suite starts real processes and speaks real UDP and
      # WebSockets. It is the only thing that would have caught bash's
      # one-datagram-per-line behaviour, so it runs in CI too.
      - run: cargo build --release
      - run: ./e2e.sh
